<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS-Laskettelu 3D (No Fog Fade)</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #222;
            color: #fff;
            font-family: 'Press Start 2P', cursive;
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
            background: #000;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            outline: none;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 10;
        }

        h1 { font-size: 3em; color: #4dcbea; text-shadow: 4px 4px 0 #0056b3; margin-bottom: 20px; }
        p { font-size: 0.8em; line-height: 1.5; max-width: 80%; color: #eee; }

        button {
            font-family: 'Press Start 2P', cursive;
            font-size: 1em;
            padding: 15px 30px;
            margin-top: 20px;
            background-color: #ff0055;
            color: white;
            border: 4px solid #90002b;
            cursor: pointer;
            transition: transform 0.1s;
        }
        button:hover { transform: scale(1.05); background-color: #ff3377; }

        .menu-options { margin-top: 30px; }
        .menu-options button { background-color: #0288d1; border-color: #01579b; font-size: 0.7em; padding: 10px 20px; margin: 0 10px; }

        #hud {
            position: absolute; top: 10px; left: 10px; width: calc(100% - 20px);
            display: flex; justify-content: space-between;
            font-size: 0.8em; color: #003366; text-shadow: 1px 1px 0 rgba(255,255,255,0.5);
            pointer-events: none; z-index: 5;
        }
        #mode-indicator { color: #ffcc00; text-shadow: 2px 2px 0 #000; }

        .modal { position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; }
        .modal-content { background-color: #333; padding: 30px; border: 4px solid #fff; width: 50%; text-align: center; position: relative; }
        .close-button { position: absolute; top: 10px; right: 20px; font-size: 28px; cursor: pointer; }
        
        #skier-options { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
        .skier-option { font-size: 2em; cursor: pointer; padding: 10px; border: 2px solid transparent; }
        .skier-option.selected { border-color: #ff0055; }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="hud" style="display: none;">
            <div id="left-hud">
                <div id="score-display">Score: 0</div>
                <div id="distance-display">Distance: 0m</div>
            </div>
            <div id="mode-indicator"></div>
            <div id="right-hud">
                <div id="high-score-display">High Score: 0</div>
            </div>
        </div>

        <div id="start-menu" class="overlay">
            <h1>SKI-3D</h1>
            <p>◀/▶: Steer | ▼: Brake | B: Autobot | D: Dev Mode</p>
            <p>Autobot: Press 1-4 to switch AI brains.</p>
            <button id="start-button">Start Game</button>
            <div class="menu-options">
                <button id="customize-button">Skin</button>
                <button id="leaderboard-button">Ranks</button>
            </div>
        </div>

        <div id="game-over-menu" class="overlay" style="display: none;">
            <h1>CRASHED!</h1>
            <p>Score: <span id="final-score">0</span></p>
            <p>Best: <span id="final-high-score">0</span></p>
            <button id="retry-button">Retry</button>
            <div class="menu-options">
                 <button id="main-menu-button">Menu</button>
            </div>
        </div>

        <div id="leaderboard-modal" class="modal">
            <div class="modal-content">
                <span class="close-button">×</span>
                <h2>Leaderboard</h2>
                <ol id="leaderboard-list" style="text-align:left; padding-left: 40px;"></ol>
            </div>
        </div>

        <div id="customize-modal" class="modal">
            <div class="modal-content">
                <span class="close-button">×</span>
                <h2>Choose Style</h2>
                <div id="skier-options"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import * as ImportedTHREE from './three.core.min.js';

        let THREE = ImportedTHREE;
        if (THREE.default) THREE = THREE.default;

        if (!THREE.WebGLRenderer) {
            alert("ERROR: Missing WebGLRenderer. Please use the correct 'three.module.min.js' renamed to 'three.core.min.js'.");
            throw new Error("Missing WebGLRenderer");
        }

        // --- SETUP ---
        const container = document.getElementById('game-container');
        const width = 800;
        const height = 600;
        
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xd1f1f9);
        
        // --- FOG SETTINGS ---
        // Starts at 500, ends at 1000. This is very far, so items won't fade early.
        scene.fog = new THREE.Fog(0xd1f1f9, 500, 1000); 

        const camera = new THREE.PerspectiveCamera(50, width / height, 0.1, 1000);
        camera.position.set(0, 80, 100); 
        camera.lookAt(0, 0, 20);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(width, height);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(50, 100, 50);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const planeGeometry = new THREE.PlaneGeometry(1000, 1000);
        const planeMaterial = new THREE.MeshPhongMaterial({ color: 0xffffff, side: THREE.DoubleSide });
        const plane = new THREE.Mesh(planeGeometry, planeMaterial);
        plane.rotation.x = -Math.PI / 2;
        plane.receiveShadow = true;
        scene.add(plane);

        // --- GEOMETRY ---
        const treeGeo = new THREE.ConeGeometry(4, 12, 8);
        const trunkGeo = new THREE.CylinderGeometry(1, 1, 4, 6);
        const rockGeo = new THREE.DodecahedronGeometry(3);
        const skiGeo = new THREE.BoxGeometry(1, 0.5, 10);
        
        let skierBodyGeo;
        if (THREE.CapsuleGeometry) {
            skierBodyGeo = new THREE.CapsuleGeometry(2, 6, 4, 8);
        } else {
            skierBodyGeo = new THREE.CylinderGeometry(2, 2, 6, 8);
        }
        
        const materials = {
            treeLeaves: new THREE.MeshLambertMaterial({ color: 0x2d5a27 }),
            treeTrunk: new THREE.MeshLambertMaterial({ color: 0x5c4033 }),
            rock: new THREE.MeshLambertMaterial({ color: 0x808080 }),
            mogul: new THREE.MeshLambertMaterial({ color: 0xeef7ff }),
            gatePole: new THREE.MeshLambertMaterial({ color: 0xff0000 }),
            gateFlag: new THREE.MeshLambertMaterial({ color: 0x0000ff }),
            skier: new THREE.MeshLambertMaterial({ color: 0xffcc00 }), 
            skis: new THREE.MeshLambertMaterial({ color: 0x333333 }),
            yeti: new THREE.MeshStandardMaterial({ color: 0xeeeeee })
        };

        // --- GAME LOGIC ---
        const SKIER_COLORS = { '⛷️': 0xffcc00, '🏂': 0xcc00ff, '🏃‍♂️': 0x00cc00, '🚴‍♀️': 0xff0000, '🛹': 0x3333ff };
        const SKIER_OPTIONS = Object.keys(SKIER_COLORS);
        
        const mapX = (val) => (val - 400) * 0.15;
        const mapZ = (val) => (val - 50) * 0.15; 

        const PLAYER_SPEED_X = 4;
        const GAME_INITIAL_SPEED_Y = 4;
        const GAME_SPEED_INCREMENT = 0.0005;
        const AUTOBOT_DETECTION_RANGE = 300;

        let gameRunning = false;
        let gameSpeedY, score, distance, highScore;
        let player, obstacles = [], yeti, yetiActive = false;
        let currentSkierChar = localStorage.getItem('skierChar') || SKIER_OPTIONS[0];
        let autobotEnabled = false;
        let devModeEnabled = false;
        let autobotDecisionCooldown = 0;
        let currentBotAlgorithmIndex = 0;
        let botDebugData = {}; 

        const scoreDisplay = document.getElementById('score-display');
        const distanceDisplay = document.getElementById('distance-display');
        const highScoreDisplay = document.getElementById('high-score-display');
        const modeIndicator = document.getElementById('mode-indicator');
        const startMenu = document.getElementById('start-menu');
        const gameOverMenu = document.getElementById('game-over-menu');
        const hud = document.getElementById('hud');
        const finalScoreEl = document.getElementById('final-score');
        const finalHighScoreEl = document.getElementById('final-high-score');

        class Player {
            constructor(x, y, char) {
                this.x = x;
                this.y = y; 
                this.width = 40;
                this.height = 40;
                this.dx = 0;
                this.isJumping = false;
                this.jumpTimer = 0;
                this.group = new THREE.Group();
                
                const bodyMat = new THREE.MeshLambertMaterial({ color: SKIER_COLORS[char] || 0xffcc00 });
                const body = new THREE.Mesh(skierBodyGeo, bodyMat);
                body.position.y = 3;
                body.castShadow = true;
                
                const leftSki = new THREE.Mesh(skiGeo, materials.skis);
                leftSki.position.set(-1.5, 0.25, 0);
                const rightSki = new THREE.Mesh(skiGeo, materials.skis);
                rightSki.position.set(1.5, 0.25, 0);
                
                this.group.add(body, leftSki, rightSki);
                scene.add(this.group);
            }

            startJump() {
                if (!this.isJumping) {
                    this.isJumping = true;
                    this.jumpTimer = 60;
                }
            }

            update() {
                this.x += this.dx;
                if (this.x < 0) this.x = 0;
                if (this.x + this.width > 800) this.x = 800 - this.width;

                if (this.isJumping) {
                    this.jumpTimer--;
                    if (this.jumpTimer <= 0) this.isJumping = false;
                }

                this.group.position.x = mapX(this.x);
                this.group.position.z = mapZ(this.y);
                
                // Rotation Logic (Keeping the fix from previous step)
                this.group.rotation.z = this.dx * 0.05; 
                this.group.rotation.y = this.dx * 0.1;
                
                if (this.isJumping) {
                    this.group.position.y = Math.sin((60 - this.jumpTimer) / 60 * Math.PI) * 10;
                    this.group.rotation.x = -0.5;
                } else {
                    this.group.position.y = 0;
                    this.group.rotation.x = 0;
                }
            }
            
            destroy() {
                scene.remove(this.group);
            }
        }

        class Obstacle {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.width = 40;
                this.height = 40;
                this.points = 0;
                this.mesh = new THREE.Group();

                if (type === 'tree') {
                    const leaves = new THREE.Mesh(treeGeo, materials.treeLeaves);
                    leaves.position.y = 6;
                    leaves.castShadow = true;
                    const trunk = new THREE.Mesh(trunkGeo, materials.treeTrunk);
                    trunk.position.y = 2;
                    this.mesh.add(trunk, leaves);
                    this.points = -1;
                    this.collisionType = 'crash';
                } else if (type === 'rock') {
                    const rock = new THREE.Mesh(rockGeo, materials.rock);
                    rock.position.y = 2;
                    rock.scale.set(1.2, 0.8, 1);
                    rock.castShadow = true;
                    this.mesh.add(rock);
                    this.points = -1;
                    this.collisionType = 'crash';
                } else if (type === 'mogul') {
                    const mogul = new THREE.Mesh(new THREE.SphereGeometry(3, 8, 6), materials.mogul);
                    mogul.position.y = 0;
                    mogul.scale.set(1, 0.5, 1);
                    this.mesh.add(mogul);
                    this.points = 100;
                    this.collisionType = 'jump';
                } else if (type === 'gate') {
                    const poleL = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 8), materials.gatePole);
                    poleL.position.set(-4, 4, 0);
                    const poleR = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 8), materials.gatePole);
                    poleR.position.set(4, 4, 0);
                    const flag = new THREE.Mesh(new THREE.BoxGeometry(8, 2, 0.1), materials.gateFlag);
                    flag.position.set(0, 6, 0);
                    this.mesh.add(poleL, poleR, flag);
                    this.points = 50;
                    this.collisionType = 'gate';
                }

                scene.add(this.mesh);
                this.updatePosition();
            }

            update() {
                this.y -= gameSpeedY; 
                this.updatePosition();
            }

            updatePosition() {
                this.mesh.position.x = mapX(this.x);
                this.mesh.position.z = mapZ(this.y);
            }

            destroy() {
                scene.remove(this.mesh);
            }
        }

        class Yeti extends Obstacle {
            constructor(x, y) {
                super(x, y, 'yeti');
                this.mesh.clear(); 
                this.width = 60;
                this.height = 60;
                this.collisionType = 'yeti';
                
                const body = new THREE.Mesh(new THREE.BoxGeometry(6, 8, 4), materials.yeti);
                body.position.y = 4;
                body.castShadow = true;
                
                const head = new THREE.Mesh(new THREE.BoxGeometry(4, 4, 4), materials.yeti);
                head.position.y = 10;
                
                const armL = new THREE.Mesh(new THREE.BoxGeometry(2, 6, 2), materials.yeti);
                armL.position.set(-4, 6, 2);
                armL.rotation.x = -1;
                
                const armR = new THREE.Mesh(new THREE.BoxGeometry(2, 6, 2), materials.yeti);
                armR.position.set(4, 6, 2);
                armR.rotation.x = -1;

                const eyeGeo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
                const eyeMat = new THREE.MeshBasicMaterial({color: 0xff0000});
                const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
                eyeL.position.set(-1, 10, 2.1);
                const eyeR = new THREE.Mesh(eyeGeo, eyeMat);
                eyeR.position.set(1, 10, 2.1);

                this.mesh.add(body, head, armL, armR, eyeL, eyeR);
                scene.add(this.mesh);
            }

            update() {
                const targetX = player.x - 10;
                if (this.x < targetX) this.x += Math.min(2, targetX - this.x);
                if (this.x > targetX) this.x -= Math.min(2, this.x - targetX);
                this.y -= (gameSpeedY * 1.05);
                this.updatePosition();
                
                this.mesh.rotation.z = Math.sin(Date.now() * 0.01) * 0.1;
                this.mesh.children[2].rotation.x = -1 + Math.sin(Date.now() * 0.02); 
                this.mesh.children[3].rotation.x = -1 + Math.cos(Date.now() * 0.02);
            }
        }

        const BOT_ALGORITHMS = [
            {
                name: 'Survivalist',
                logic: (obsList) => {
                    const LANE_WIDTH = 80;
                    const px = player.x + 20;
                    const lanes = { left: false, center: false, right: false };
                    
                    obsList.forEach(o => {
                        if (o.collisionType === 'crash' || o.collisionType === 'yeti') {
                            const ox = o.x + o.width/2;
                            if (Math.abs(ox - (px - LANE_WIDTH)) < 30) lanes.left = true;
                            if (Math.abs(ox - px) < 30) lanes.center = true;
                            if (Math.abs(ox - (px + LANE_WIDTH)) < 30) lanes.right = true;
                        }
                    });

                    if (lanes.center) {
                        if (!lanes.right) player.dx = PLAYER_SPEED_X;
                        else if (!lanes.left) player.dx = -PLAYER_SPEED_X;
                    } else {
                        if (px < 100) player.dx = PLAYER_SPEED_X;
                        else if (px > 700) player.dx = -PLAYER_SPEED_X;
                        else player.dx = 0;
                    }
                    return { lanes }; 
                }
            },
            {
                name: 'Greedy',
                logic: (obsList) => {
                    const targets = obsList.filter(o => o.collisionType === 'jump' || o.collisionType === 'gate');
                    const threats = obsList.filter(o => o.collisionType === 'crash' && o.y < player.y + 120);
                    
                    if (threats.length > 0) {
                        player.dx = (threats[0].x < player.x) ? PLAYER_SPEED_X : -PLAYER_SPEED_X;
                    } else if (targets.length > 0) {
                        const t = targets[0];
                        if (t.x + 20 < player.x) player.dx = -PLAYER_SPEED_X;
                        else if (t.x > player.x + 40) player.dx = PLAYER_SPEED_X;
                        else player.dx = 0;
                    } else {
                        player.dx = 0;
                    }
                    return {};
                }
            }
        ];

        function runAutobot() {
            if (autobotDecisionCooldown > 0) { autobotDecisionCooldown--; return; }
            autobotDecisionCooldown = 10;

            const relevant = obstacles.filter(o => o.y > player.y && o.y < player.y + AUTOBOT_DETECTION_RANGE);
            const algo = BOT_ALGORITHMS[currentBotAlgorithmIndex % BOT_ALGORITHMS.length].logic;
            botDebugData = algo(relevant) || {};
        }

        function startGame() {
            if (player) player.destroy();
            obstacles.forEach(o => o.destroy());
            obstacles = [];
            
            gameRunning = true;
            gameSpeedY = GAME_INITIAL_SPEED_Y;
            score = 0;
            distance = 0;
            highScore = parseInt(localStorage.getItem('ski3dHighScore') || '0');
            yetiActive = false;
            yeti = null;
            
            player = new Player(380, 50, currentSkierChar);
            
            startMenu.style.display = 'none';
            gameOverMenu.style.display = 'none';
            hud.style.display = 'flex';
            
            animate();
        }

        function gameOver() {
            gameRunning = false;
            if (!autobotEnabled) {
                if (score > highScore) {
                    highScore = Math.floor(score);
                    localStorage.setItem('ski3dHighScore', highScore);
                }
                saveLeaderboard(Math.floor(score));
            }
            finalScoreEl.textContent = Math.floor(score);
            finalHighScoreEl.textContent = highScore;
            hud.style.display = 'none';
            gameOverMenu.style.display = 'flex';
        }

        function spawnObstacles() {
            for (let i = obstacles.length - 1; i >= 0; i--) {
                // UPDATED: Check is now -400 instead of -50. 
                // This allows items to travel far into the distance (top of screen) before disappearing.
                if (obstacles[i].y < -2000) { 
                    obstacles[i].destroy();
                    obstacles.splice(i, 1);
                }
            }

            if (obstacles.length > 40) return;

            if (Math.random() < 0.05) {
                const x = Math.random() * 760;
                const y = 700; 
                const r = Math.random();
                let type = 'tree';
                if (r < 0.5) type = 'tree';
                else if (r < 0.75) type = 'rock';
                else if (r < 0.9) type = 'mogul';
                else type = 'gate';
                
                obstacles.push(new Obstacle(x, y, type));
            }
        }

        function checkCollisions() {
            const pRect = { l: player.x + 10, r: player.x + 30, t: player.y + 10, b: player.y + 30 };
            
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                const oRect = { l: obs.x + 5, r: obs.x + obs.width - 5, t: obs.y + 5, b: obs.y + obs.height - 5 };

                if (pRect.l < oRect.r && pRect.r > oRect.l && pRect.t < oRect.b && pRect.b > oRect.t) {
                    if (player.isJumping && obs.collisionType === 'crash') continue; 
                    
                    if (obs.collisionType === 'crash' || obs.collisionType === 'yeti') {
                        gameOver();
                    } else if (obs.collisionType === 'jump') {
                        player.startJump();
                        score += obs.points;
                    } else if (obs.collisionType === 'gate') {
                        score += obs.points;
                        obs.destroy();
                        obstacles.splice(i, 1);
                    }
                }
            }
        }

        function animate() {
            if (!gameRunning) return;

            requestAnimationFrame(animate);

            if (autobotEnabled) runAutobot();
            
            player.update();
            obstacles.forEach(o => o.update());
            
            distance += gameSpeedY / 20;
            score += gameSpeedY / 10;
            gameSpeedY += GAME_SPEED_INCREMENT;

            spawnObstacles();
            checkCollisions();

            if (distance > 2000 && !yetiActive) {
                yetiActive = true;
                yeti = new Yeti(Math.random() * 700, 900);
                obstacles.push(yeti);
            }

            scoreDisplay.textContent = `Score: ${Math.floor(score)}`;
            distanceDisplay.textContent = `Dist: ${Math.floor(distance)}m`;
            highScoreDisplay.textContent = `Best: ${highScore}`;
            
            let modeText = '';
            if (autobotEnabled) modeText += `[BOT: ${BOT_ALGORITHMS[currentBotAlgorithmIndex%2].name}] `;
            if (devModeEnabled) modeText += '[DEV]';
            modeIndicator.textContent = modeText;

            renderer.render(scene, camera);
        }

        window.addEventListener('keydown', (e) => {
            const k = e.key.toLowerCase();
            if (k === 'b') { autobotEnabled = !autobotEnabled; if(player) player.dx=0; }
            if (k === 'd') devModeEnabled = !devModeEnabled;
            if (k >= '1' && k <= '4') currentBotAlgorithmIndex = parseInt(k) - 1;

            if (!gameRunning || autobotEnabled) return;
            
            if (e.key === 'ArrowLeft') player.dx = -PLAYER_SPEED_X;
            if (e.key === 'ArrowRight') player.dx = PLAYER_SPEED_X;
            if (e.key === 'ArrowDown') player.dx = 0;
        });

        document.getElementById('start-button').onclick = startGame;
        document.getElementById('retry-button').onclick = startGame;
        document.getElementById('main-menu-button').onclick = () => { gameOverMenu.style.display = 'none'; startMenu.style.display = 'flex'; };
        
        function saveLeaderboard(s) {
            let b = JSON.parse(localStorage.getItem('ski3dLeaderboard') || '[]');
            b.push(s); b.sort((x,y)=>y-x); b = b.slice(0,5);
            localStorage.setItem('ski3dLeaderboard', JSON.stringify(b));
        }
        
        const list = document.getElementById('leaderboard-list');
        document.getElementById('leaderboard-button').onclick = () => {
            document.getElementById('leaderboard-modal').style.display = 'flex';
            list.innerHTML = '';
            JSON.parse(localStorage.getItem('ski3dLeaderboard')||'[]').forEach((s,i)=> {
                list.innerHTML += `<li>${s}</li>`;
            });
        };
        
        const optContainer = document.getElementById('skier-options');
        document.getElementById('customize-button').onclick = () => {
            document.getElementById('customize-modal').style.display = 'flex';
            optContainer.innerHTML = '';
            SKIER_OPTIONS.forEach(char => {
                const d = document.createElement('div');
                d.className = `skier-option ${char===currentSkierChar?'selected':''}`;
                d.textContent = char;
                d.onclick = () => { currentSkierChar = char; localStorage.setItem('skierChar', char); document.querySelectorAll('.skier-option').forEach(x=>x.classList.remove('selected')); d.classList.add('selected'); };
                optContainer.appendChild(d);
            });
        };

        document.querySelectorAll('.close-button').forEach(b => b.onclick = () => {
            document.querySelectorAll('.modal').forEach(m=>m.style.display='none');
        });
    </script>
</body>
</html>
